name: Hisobchi Design QA

on:
  push:
    branches:
      - design/d01-ivory-plum-foundation
      - design/d02-transaction-entry-calendar
  pull_request:
    branches:
      - main
      - design/d01-ivory-plum-foundation

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - name: Calendar and integer UZS validation tests
        run: node --experimental-strip-types --test tests/calendar.test.mjs tests/amount-validation.test.mjs
