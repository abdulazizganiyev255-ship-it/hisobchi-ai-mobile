name: TypeScript validation

on:
  pull_request:
    branches: [main, feat/dashboard-premium-v02, feat/transactions-v03, feat/transactions-date-range-v04, feat/analytics-premium-v06, feat/design-system-v1-foundations, feat/design-system-v1-dashboard-operations, feat/design-system-v1-transaction-editor, feat/design-system-v1-profile, feat/design-system-v1-onboarding-demo, feat/design-system-v1-final-ui-qa, fix/transactions-fab-calendar-v16, feat/analytics-custom-date-range-v17, test/integration-release-gate-v18, feat/ui-final-polish-v19]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Transaction model tests
        run: npm run test:transactions
      - name: Analytics aggregation tests
        run: npm run test:analytics
      - name: Design system and contrast tests
        run: npm run test:design-system
      - name: Calendar date model tests
        run: npm run test:calendar
      - name: UI integration contracts
        run: npm run test:ui-contract
      - name: Cross-screen financial lifecycle tests
        run: npm run test:integration
