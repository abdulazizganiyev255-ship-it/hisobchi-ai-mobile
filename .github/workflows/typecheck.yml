name: TypeScript validation

on:
  pull_request:
    branches: [main, feat/dashboard-premium-v02, feat/transactions-v03, feat/transactions-date-range-v04]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Transaction model tests
        run: npm run test:transactions
      - name: Analytics aggregation tests
        run: npm run test:analytics
