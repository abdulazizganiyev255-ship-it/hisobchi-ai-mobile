name: Expo Web mobile smoke QA

on:
  pull_request:
    branches:
      - main
      - feat/ui-final-polish-v19
      - test/web-responsive-e2e-v20

jobs:
  web-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      SMOKE_URL: http://127.0.0.1:8090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for responsive E2E
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Expo Web
        run: |
          nohup npx expo start --web --port 8090 --clear > /tmp/hisobchi-expo.log 2>&1 &
          echo $! > /tmp/hisobchi-expo.pid
      - name: Test real web renders at 320, 360 and 393 pixels
        run: node scripts/test-web-smoke.cjs
      - name: Expo logs on failure
        if: failure()
        run: cat /tmp/hisobchi-expo.log || true
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisobot-web-smoke-screenshots
          path: artifacts/web-smoke/*.png
          if-no-files-found: warn
          retention-days: 7
